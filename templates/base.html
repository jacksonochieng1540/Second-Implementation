<!DOCTYPE html>
<html>
<head>
    <title>SecureTrack - Vehicle Security System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 60px; }
        .navbar-brand { font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">🚗 SecureTrack</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/vehicle/">Dashboard</a>
                {% if user.is_authenticated %}
                    <a class="nav-link" href="{% url 'admin_panel' %}">Admin Panel</a>
                    <a class="nav-link" href="/auth/logout/">Logout ({{ user.username }})</a>
                {% else %}
                    <a class="nav-link" href="/auth/login/">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>
    
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
